<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Geist;src:url(file:///home/user/iBoBoSniperESmecher/brand/fonts/Geist-Regular.ttf);font-weight:400}
@font-face{font-family:Geist;src:url(file:///home/user/iBoBoSniperESmecher/brand/fonts/Geist-Medium.ttf);font-weight:500}
@font-face{font-family:Geist;src:url(file:///home/user/iBoBoSniperESmecher/brand/fonts/Geist-SemiBold.ttf);font-weight:600}
@font-face{font-family:'Instrument Serif';src:url(file:///home/user/iBoBoSniperESmecher/brand/fonts/InstrumentSerif-Italic.ttf);font-style:italic}
:root{--text:#F3F4F6;--blue:#3D8BFF;--green:#3FCF8E}
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
body{font-family:Geist;font-feature-settings:"cv11","ss01";-webkit-font-smoothing:antialiased;position:relative}
.abs{position:absolute}
/* captions: whole group pops in on its first word */
.cap{position:absolute;left:0;right:0;display:flex;justify-content:center;align-items:baseline;gap:0 .24em;
     white-space:nowrap;color:var(--text);font-weight:600;letter-spacing:-.02em;transform-origin:50% 60%}
.cap.face{top:1080px;font-size:64px;text-shadow:0 2px 16px rgba(0,0,0,.6),0 0 2px rgba(0,0,0,.4)}
.cap.board{top:878px;font-size:54px}
.cap .k,.cap .m{font-family:'Instrument Serif';font-style:italic;font-weight:400;font-size:1.3em;letter-spacing:-.01em}
.cap .k{color:var(--blue)} .cap .m{color:var(--green)}
/* decision pill (on the board) */
.pill{left:28px;top:996px;display:flex;align-items:center;gap:16px;padding:12px 26px 12px 12px;border-radius:999px;
  background:#0E0F11;border:1px solid #1F2125;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.pill .c{width:46px;height:46px;border-radius:50%;border:2px solid var(--blue);color:var(--blue);display:grid;place-items:center;
  font-weight:600;font-size:24px;box-sizing:border-box}
.pill .t{color:var(--green);font-weight:600;font-size:34px;letter-spacing:-.02em}
/* cta (on the board) */
.cta{left:0;right:0;top:1470px;display:flex;justify-content:center}
.cta span{background:var(--blue);color:#fff;font-weight:600;font-size:40px;letter-spacing:.1em;text-transform:uppercase;
  padding:24px 48px;border-radius:999px;box-shadow:0 0 50px rgba(61,139,255,.6)}
/* transition: flash + glare streak */
.flash{inset:0;background:radial-gradient(ellipse at 50% 45%,#fff 0%,#F3F7FF 55%,#DCE8FF 100%)}
.glare{left:-60%;top:-20%;width:220%;height:140%;
  background:linear-gradient(110deg,transparent 38%,rgba(190,215,255,.0) 41%,rgba(220,235,255,.85) 47%,#fff 50%,rgba(220,235,255,.85) 53%,rgba(190,215,255,0) 59%,transparent 62%)}
</style></head>
<body>
<div id="root"></div>
<script>
let EL=[];
const h=html=>{const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild};
const clamp=x=>Math.max(0,Math.min(1,x));
const easeOut=x=>1-Math.pow(1-clamp(x),3);

function build(edl){
  const root=document.getElementById('root');
  const lineT={};
  for(const s of edl.segments){ if(!(s.line in lineT)) lineT[s.line]=s.t0; }
  const lineOf=c=>+c.group.split('-')[0];
  const wordT=(txt,line)=>{const c=edl.captions.find(c=>c.text.replace(/[.,]/g,'')===txt&&lineOf(c)===line);return c?c.t:lineT[line]};

  // captions
  const groups=[];
  for(const c of edl.captions){
    let g=groups[groups.length-1];
    if(!g||g.id!==c.group){g={id:c.group,layout:c.layout,words:[]};groups.push(g)}
    g.words.push(c);
  }
  groups.forEach((g,i)=>{
    const line=+g.id.split('-')[0];
    const lineEnd=edl.captions.filter(c=>lineOf(c)===line).map(c=>c.line_end).find(x=>x!==undefined);
    const nxt=groups[i+1];
    g.t0=g.words[0].t;
    g.t1=nxt? nxt.words[0].t : lineEnd;   // hold until the next group: no empty gaps
    const row=h(`<div class="cap ${g.layout}"></div>`);
    g.words.forEach(w=>row.appendChild(h(`<span class="${w.key==='accent'?'k':w.key==='money'?'m':''}">${w.text}</span>`)));
    root.appendChild(row);g.row=row;
  });
  EL.push({kind:'captions',groups});

  const add=(html,t0,t1,anim)=>{const el=h(html);el.classList.add('abs');root.appendChild(el);EL.push({el,t0,t1,anim})};
  // board-only graphics
  const dec=['the topic your buyer is ready for','the result you lead with','your terms + your numbers','a cta your backend can close'];
  const decLines=[[5,6],[6,8],[8,9],[9,10]];
  dec.forEach((t,i)=>add(`<div class="pill"><div class="c">${i+1}</div><div class="t">${t}</div></div>`,
      lineT[decLines[i][0]], lineT[decLines[i][1]], 'slide'));
  add(`<div class="cta"><span>comment “ai”</span></div>`, wordT('ai',10), lineT[11], 'pop');

}

function setTime(t){
  for(const e of EL){
    if(e.kind==='captions'){
      for(const g of e.groups){
        const on=t>=g.t0-1e-6&&t<g.t1;
        g.row.style.display=on?'flex':'none';
        if(!on) continue;
        const p=easeOut((t-g.t0)/0.10);              // 100ms pop
        g.row.style.opacity=p;
        g.row.style.filter=`blur(${(1-p)*6}px)`;
        g.row.style.transform=`scale(${0.92+0.08*p})`;
      }
      continue;
    }
    const {el,t0,t1,anim}=e;
    const on=t>=t0&&t<t1;
    el.style.display=on?'':'none';
    if(!on) continue;
    if(anim.flash!==undefined){                       // ramp up 0.10s, peak at the cut, decay 0.28s
      const T=anim.flash;
      el.style.opacity= t<T ? 0.9*Math.pow((t-t0)/(T-t0),2) : 0.9*Math.pow(1-(t-T)/(t1-T),2);
      continue;
    }
    if(anim.glare!==undefined){                       // diagonal streak sweeping left -> right
      const p=clamp((t-t0)/(t1-t0));
      el.style.transform=`translateX(${(-45+90*p)}%)`;
      el.style.opacity=Math.sin(Math.PI*p);
      continue;
    }
    const p=easeOut((t-t0)/0.22);
    const out=clamp((t-(t1-0.08))/0.08);
    el.style.opacity=p*(1-out);
    el.style.filter=`blur(${(1-p)*8}px)`;
    el.style.transform= anim==='slide'?`translateX(${(1-p)*-24}px)`:`scale(${0.9+0.1*p})`;
  }
}
window.build=build;window.setTime=setTime;
</script>
</body></html>
